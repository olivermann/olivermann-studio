# Photography page gallery. One entry per photo.
# The gallery is ordered by date, newest first (list order does not matter).
#
# Fields:
#   src:         filename inside src/assets/photos/ (required)
#   alt:         descriptive alt text (required)
#   category:    portrait | event (required)
#   date:        YYYY-MM-DD, date taken (required, drives the order)
#   caption:     optional, shown in the lightbox
#   flickrAlbum: optional, event photos only. Renders the
#                "View full album on Flickr" link in the lightbox.

